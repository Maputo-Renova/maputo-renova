name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Auditar, typecheck, lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://phgoebpmijqdblllqpft.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_X3TD-t3bkasAF2zJbrvbYw_GuyG5_4y
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: npm audit (vulnerabilidades altas)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
