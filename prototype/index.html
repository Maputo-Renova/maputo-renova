<!doctype html>
<html lang="pt-MZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maputo Renova</title>
<meta name="description" content="Protótipo — gestão de condomínios em Maputo. Dados de demonstração.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ tokens ============ */
:root{
  --bg:#F4F4F1;
  --card:#FFFFFF;
  --ink:#171E1A;
  --ink-2:#4F5953;
  --ink-3:#5E6862;
  --line:#E7E8E2;
  --line-soft:#EFF0EA;
  --green-800:#0A5C36;
  --green-700:#0C7A46;
  --green-600:#0E9F5B;
  --green-150:#D7F0E2;
  --green-100:#E4F5EC;
  --green-50:#F1FAF5;
  --amber-700:#935410;
  --amber-100:#FBEFD9;
  --red-700:#B3362B;
  --red-100:#FAE7E4;
  --blue-700:#2155A3;
  --blue-100:#E6EEFA;
  --r-card:16px;
  --r-ctl:10px;
  --shadow:0 1px 2px rgba(23,30,26,.05),0 10px 28px rgba(23,30,26,.07);
  --shadow-lift:0 2px 4px rgba(23,30,26,.06),0 16px 40px rgba(23,30,26,.12);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.5;
  caret-color:var(--green-600);
}
::selection{background:var(--green-150);color:var(--green-800)}
:focus-visible{outline:2px solid var(--green-600);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D4D6CE;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img,svg{display:block}
.num{font-variant-numeric:tabular-nums}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.sm{width:16px;height:16px}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{
  background:var(--card);border-right:1px solid var(--line);
  padding:22px 16px 16px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--green-600);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-weight:800;font-size:16.5px;letter-spacing:-.01em;line-height:1.15}
.brand-sub{font-size:12px;color:var(--ink-3);font-weight:600}
.nav-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 12px;border-radius:11px;color:var(--ink-2);font-weight:600;font-size:14px;
  transition:background .15s var(--ease),color .15s var(--ease);
}
.nav-item:hover{background:var(--line-soft);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--green-100);color:var(--green-800)}
.nav-item[aria-current="page"] .icon{stroke:var(--green-700)}
.nav-badge{margin-left:auto;background:var(--green-600);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 7px}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft)}
.role-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.role-box p{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:9px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.role-btn{
  padding:7px 6px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  font-size:12px;font-weight:700;color:var(--ink-2);text-align:center;
  transition:all .15s var(--ease);
}
.role-btn:hover{border-color:var(--green-600);color:var(--green-700)}
.role-btn.on{background:var(--green-600);border-color:var(--green-600);color:#fff}
.demo-tag{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:12px;color:var(--ink-3);font-weight:600}
.demo-dot{width:6px;height:6px;border-radius:50%;background:var(--amber-700)}

/* ============ main ============ */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:16px 32px;background:rgba(244,244,241,.85);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:30;border-bottom:1px solid transparent;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);place-items:center}
.search{
  flex:1;max-width:360px;display:flex;align-items:center;gap:9px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px;color:var(--ink-3);
}
.search input{border:none;outline:none;background:none;width:100%;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}
.icon-btn{
  width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);position:relative;
  transition:all .15s var(--ease);
}
.icon-btn:hover{border-color:var(--green-600);color:var(--green-700)}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--red-700);border:2px solid var(--card)}
.avatar{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 5px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.avatar-pic{width:32px;height:32px;border-radius:50%;background:var(--green-150);color:var(--green-800);display:grid;place-items:center;font-size:12.5px;font-weight:800}
.avatar-name{font-size:13px;font-weight:700;padding-right:6px}

.screen{padding:12px 32px 48px;max-width:1240px;width:100%;margin:0 auto;animation:screen-in .32s var(--ease)}
@keyframes screen-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:14px 0 22px}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.page-head .sub{color:var(--ink-2);font-size:14px;margin-top:3px}
.page-head-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* ============ controls ============ */
.btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:700;font-size:13.5px;
  padding:10px 18px;transition:all .16s var(--ease);border:1px solid transparent;
}
.btn-primary{background:var(--green-600);color:#fff;box-shadow:0 1px 2px rgba(23,30,26,.1),0 6px 16px rgba(23,30,26,.14)}
.btn-primary:hover{background:var(--green-700);transform:translateY(-1px)}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--green-600);color:var(--green-700)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000;transform:translateY(-1px)}
.btn-danger{background:var(--card);border-color:var(--line);color:var(--red-700)}
.btn-danger:hover{border-color:var(--red-700);background:var(--red-100)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.month-pick{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.month-pick b{font-size:13.5px;font-weight:800;padding:0 10px;min-width:122px;text-align:center}
.month-pick button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.month-pick button:hover{background:var(--line-soft);color:var(--ink)}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:12px;font-weight:700;padding:4px 11px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pago{background:var(--green-100);color:var(--green-800)}
.pill.pendente{background:var(--amber-100);color:var(--amber-700)}
.pill.atraso{background:var(--red-100);color:var(--red-700)}
.pill.confirmar{background:var(--blue-100);color:var(--blue-700)}
.pill.neutro{background:var(--line-soft);color:var(--ink-2)}
.pill.suspenso{background:var(--red-100);color:var(--red-700)}
.pill.activo{background:var(--green-100);color:var(--green-800)}

/* ============ cards ============ */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card-head h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.card-head .spacer{margin-left:auto}
.card-ico{width:36px;height:36px;border-radius:10px;background:var(--green-100);color:var(--green-700);display:grid;place-items:center;flex:none}
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(3,1fr)}
.g-23{grid-template-columns:2fr 1fr}
.g-12{grid-template-columns:1fr 1fr}
.g-13{grid-template-columns:1fr 2fr}
.mt{margin-top:18px}

.kpi .lbl{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13.5px;font-weight:700}
.kpi .val{font-size:29px;font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
.kpi .val small{font-size:15px;font-weight:700;color:var(--ink-3);letter-spacing:0}
.kpi .cmp{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.kpi .cmp .up,.kpi .cmp .down{display:inline-flex;align-items:center;gap:5px}
.kpi .cmp .up{color:var(--green-700)}
.kpi .cmp .down{color:var(--red-700)}

/* chart */
.chart{display:flex;flex-direction:column;gap:10px}
.chart-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:9px;align-items:end;height:190px;padding-top:12px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{
  width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--green-150);
  position:relative;transition:background .15s var(--ease);
}
.bar:hover,.bar.sel{background:var(--green-600)}
.bar.sel::after{
  content:attr(data-v);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:7px;white-space:nowrap;
}
.bar-lbl{font-size:12px;font-weight:700;color:var(--ink-3)}
.chart-legend{display:flex;gap:16px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chart-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}

/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{
  text-align:left;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s var(--ease)}
.tbl tbody tr[data-condo]{cursor:pointer}
.tbl tbody tr:hover{background:var(--green-50)}
.tbl .r{text-align:right}
.tbl .b{font-weight:700}
.tbl-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
.cell-main{font-weight:700}
.cell-sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.link{color:var(--green-700);font-weight:700;text-decoration:none;font-size:13.5px}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* filtros */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;color:var(--ink-2);transition:all .14s var(--ease)}
.chip:hover{border-color:var(--green-600);color:var(--green-700)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* listas */
.row-list>li{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-soft);list-style:none}
.row-list>li:last-child{border-bottom:none}
.row-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.row-ico.g{background:var(--green-100);color:var(--green-700)}
.row-ico.a{background:var(--amber-100);color:var(--amber-700)}
.row-ico.r{background:var(--red-100);color:var(--red-700)}
.row-ico.b{background:var(--blue-100);color:var(--blue-700)}
.row-body{min-width:0;flex:1}
.row-body .t{font-weight:700;font-size:14px}
.row-body .s{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.row-end{text-align:right;flex:none}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 20px;text-align:center}
.empty .e-ico{width:52px;height:52px;border-radius:16px;background:var(--green-100);color:var(--green-700);display:grid;place-items:center}
.empty b{font-size:15px}
.empty p{font-size:13.5px;color:var(--ink-3);max-width:300px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:var(--r-ctl);padding:11px 13px;font-size:14px;background:var(--card);
  transition:border-color .14s var(--ease),box-shadow .14s var(--ease);width:100%;
}
.field input:hover,.field select:hover{border-color:#CFD2C8}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green-600);box-shadow:0 0 0 3px var(--green-100)}
.field .hint{font-size:12px;color:var(--ink-3)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* alertas */
.alert-dup{border:1px solid var(--red-700);background:var(--red-100);border-radius:14px;padding:16px;display:flex;gap:12px;margin-bottom:16px}
.alert-dup .icon{color:var(--red-700);margin-top:2px}
.alert-dup b{color:var(--red-700)}
.alert-dup .conflito{margin-top:10px;background:var(--card);border-radius:10px;padding:12px 14px;font-size:13.5px}
.note{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:13px 15px;font-size:13px;color:var(--ink-2);display:flex;gap:10px}
.note .icon{color:var(--green-700);margin-top:1px}

/* drawer + modal */
.overlay{position:fixed;inset:0;background:rgba(23,30,26,.38);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s var(--ease)}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:60;
  box-shadow:var(--shadow-lift);transform:translateX(104%);transition:transform .3s var(--ease);
  display:flex;flex-direction:column;
}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
.drawer-body{padding:22px 24px;overflow-y:auto;flex:1}
.drawer-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.modal{
  position:fixed;z-index:60;inset:0;display:grid;place-items:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .22s var(--ease);
}
.modal.open{opacity:1;pointer-events:auto}
.modal-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lift);width:min(430px,100%);padding:26px;transform:translateY(10px);transition:transform .3s var(--ease)}
.modal.open .modal-card{transform:none}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);z-index:80;
  background:var(--ink);color:#fff;border-radius:999px;padding:11px 20px;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;transition:all .28s var(--ease);
  box-shadow:var(--shadow-lift);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .icon{color:var(--green-600)}

/* pagamento */
.pay-hero{background:linear-gradient(135deg,var(--green-700),var(--green-600));color:#fff;border-radius:var(--r-card);padding:26px;box-shadow:0 2px 4px rgba(23,30,26,.08),0 18px 40px rgba(23,30,26,.18)}
.pay-hero .q-lbl{font-size:13.5px;font-weight:700;opacity:.85}
.pay-hero .q-val{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.pay-hero .q-val small{font-size:18px;font-weight:700;opacity:.8}
.pay-hero .q-sub{font-size:13px;opacity:.85;font-weight:600}
.pay-split{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.22)}
.pay-split:last-of-type{border-bottom:none}
.pay-split b{font-weight:800}
.method{width:100%;display:flex;align-items:center;gap:13px;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);transition:all .15s var(--ease);text-align:left;margin-bottom:10px}
.method:hover{border-color:var(--green-600);box-shadow:var(--shadow)}
.method .m-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:8.5px;line-height:1.1;text-align:center;letter-spacing:.02em;color:#fff;flex:none}
.m-ico .icon{width:23px;height:23px;stroke-width:1.5}
.m-ico.mpesa{background:#C41318}
.m-ico.emola{background:#F28A00}
.m-ico.banco{background:var(--ink)}
.method b{font-size:14.5px}
.method .s{font-size:12.5px;color:var(--ink-3)}
.method > .icon{margin-left:auto;color:var(--ink-3)}
.m-ico .icon{margin-left:0}
.spinner{width:42px;height:42px;border-radius:50%;border:3px solid var(--green-100);border-top-color:var(--green-600);animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.ref-box{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px dashed #C9CCC2;border-radius:12px;padding:13px 15px;font-weight:800;font-size:15px;letter-spacing:.03em}
.copy-btn{display:inline-flex;align-items:center;gap:6px;color:var(--green-700);font-weight:700;font-size:12.5px}
.copy-btn:hover{text-decoration:underline;text-underline-offset:3px}

/* progress */
.prog{display:block;height:7px;background:var(--line-soft);border-radius:999px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;border-radius:999px;background:var(--green-600)}
.prog.warn i{background:var(--amber-700)}
.prog.bad i{background:var(--red-700)}

/* config */
.cfg-row{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line-soft)}
.cfg-row:last-child{border-bottom:none}
.cfg-row .inp{width:86px}
.cfg-row .inp input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;font-size:14px;font-weight:700;text-align:right}

/* aceitação de termos */
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);margin:2px 0 14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--green-600);margin-top:1px;flex:none;cursor:pointer}

/* página de acesso */
body.auth .sidebar,body.auth .topbar{display:none}
body.auth .app{grid-template-columns:1fr}
body.auth .screen{max-width:480px;padding-top:6vh}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;text-align:center}
.auth-brand .brand-mark{width:56px;height:56px;border-radius:16px}
.auth-brand .brand-mark svg{width:30px;height:30px}
.auth-links{display:flex;justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:8px}
.avatar{cursor:pointer;transition:border-color .15s var(--ease)}
.avatar:hover{border-color:var(--green-600)}
.pf-pic{width:68px;height:68px;border-radius:50%;background:var(--green-150);color:var(--green-800);display:grid;place-items:center;font-size:23px;font-weight:800;flex:none}

/* responsive */
@media (max-width:1060px){
  .g-kpi{grid-template-columns:1fr 1fr}
  .g-23,.g-12,.g-13{grid-template-columns:1fr}
}
@media (max-width:860px){
  /* tabelas viram listas empilhadas: descrição à esquerda, valores/estados à direita */
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-content:start;padding:14px 0;border-bottom:1px solid var(--line-soft)}
  .tbl tbody tr:hover{background:transparent}
  .tbl tr:last-child{border-bottom:none}
  .tbl td{display:block;border-bottom:none;padding:0}
  .tbl td.r,.tbl td:has(.pill){grid-column:2;text-align:right;justify-self:end}
  .tbl td:not(.r):not(:has(.pill)){grid-column:1}
  .tbl-wrap{margin:0;padding:0;overflow:visible}
  /* cabeçalho de cada valor nas tabelas empilhadas */
  .tbl td[data-th]::before{
    content:attr(data-th);display:block;font-size:12px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px;
  }
  /* listas: acções passam para baixo em vez de esmagar o texto */
  .row-list>li{flex-wrap:wrap}
  .row-list>li .row-body{flex:1 1 180px}
  .row-list>li .row-end{margin-left:auto}
  /* linhas de configuração: ícone + conteúdo em grelha, acções por baixo */
  .cfg-row{display:grid;grid-template-columns:38px 1fr;align-items:start;gap:6px 12px}
  .cfg-row>*:nth-child(n+3){grid-column:2;justify-self:start}
  /* gráfico condensado: últimos 6 meses */
  .chart-bars{grid-template-columns:repeat(6,1fr);gap:10px;height:150px}
  .bar-col:nth-child(-n+6){display:none}
  .bar-col:nth-last-child(-n+2) .bar.sel::after{left:auto;right:0;transform:none}
  .card-head{flex-wrap:wrap;row-gap:8px}
  .chips{gap:6px}
  .chip{padding:6px 11px;font-size:12px}
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed;z-index:70;width:min(300px,86vw);height:100vh;left:0;top:0;
    transform:translateX(-104%);transition:transform .3s var(--ease);box-shadow:var(--shadow-lift);
  }
  .sidebar.open{transform:none}
  .menu-btn{display:grid}
  .topbar{padding:12px 18px}
  .search{display:none}
  .screen{padding:8px 18px 40px}
  .page-head h1{font-size:22px}
  .g-kpi{grid-template-columns:1fr}
  .f-row,.f-row3{grid-template-columns:1fr}
  .kpi .val{font-size:25px}
  .chart-bars{gap:5px;height:150px}
  .avatar-name{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}

  return Array.from({length:c.flats},(_,i)=>{
    const bloco = BLOCOS[i%2], numero = `${Math.floor(i/6)+1}0${(i%6)+1}`;
    return {
    id:i+1,
    bloco,
    andar:Math.floor(i/6)+1,
    numero,
    nome:NOMES[(i*7+seed)%24],
    tel:`8${[2,4,5][i%3]} ${String(300+i*9+seed).padStart(3,'0')} ${String(2110+i*67).slice(-4)}`,
    quota: i%5===0 ? quotaBase+300 : quotaBase,
    ref:`MR-00${1200+seed*40+i}`,
    regref:`${sg}-${bloco}${numero}`,
  };});
}
function estadosDoCondo(c){
  if(c.nome==='Jardim das Acácias') return FLATS.map(f=>estadoDe(f));
  if(!c.flats) return [];
  const seed = c.nome.length;
  const nPagos = Math.min(Math.round(c.cobrado/c.esperado*c.flats), c.flats - c.atraso);
  const nConf = Math.min(2, Math.max(0, c.flats - nPagos - c.atraso));
  return Array.from({length:c.flats},(_,i)=>{
    const j = (i*11+seed)%c.flats;
    if(j < nPagos) return 'pago';
    if(j < nPagos+nConf) return 'confirmar';
    if(j >= c.flats-c.atraso) return 'atraso';
    return 'pendente';
  });
}

  const pagas = FLATS.filter(f=>estadoDe(f)==='pago').length;
  const total = FLATS.length;
  return { pagas, total, emDia: pagas===total,
    valorTotal: total*S.taxas.associacao, liquidado: pagas*S.taxas.associacao,
    falta: (total-pagas)*S.taxas.associacao,
    emFalta: FLATS.filter(f=>estadoDe(f)!=='pago').map(f=>f.numero) };
}
function cardAssociacao(){
  const a = assocEstado();
  const pct = Math.round(a.pagas/a.total*100);
  return `
  <div class="card mt">
    <div class="card-head"><span class="card-ico">${ico('shield')}</span>
      <div><h2>Taxa da associação · Outubro</h2><div class="cell-sub">Fatura consolidada: ${fmtD(S.taxas.associacao)} MT × ${a.total} flats = <b class="num">${MT(a.valorTotal)}</b> · liquidada automaticamente pelos pagamentos dos moradores</div></div>
      <span class="spacer"></span>
      ${a.emDia?'<span class="pill pago">Em dia</span>':'<span class="pill atraso">Em dívida</span>'}

    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px"><span class="num">${a.pagas} de ${a.total} flats pagaram</span><span class="num">${pct}%</span></div>
    <span class="prog ${pct<100?'warn':''}"><i style="width:${pct}%"></i></span>
    ${a.emDia?'':`<div class="cell-sub" style="margin-top:8px">Faltam <b class="num">${MT(a.falta)}</b> · flats em falta: <span class="num">${a.emFalta.slice(0,8).join(', ')}${a.emFalta.length>8?` +${a.emFalta.length-8}`:''}</span> · <button class="link" id="assoc-ver">Ver pagamentos</button></div>`}

function projCard(p, papel){
  const finTxt = p.fin==='quota'
    ? `Quota extraordinária · <b class="num">${MT(p.quotaExtra)}</b> por flat`
    : p.fin==='associacao' ? 'Fundo da associação · votação na assembleia' : 'Fundo do condomínio';
  const pctFin = p.fin==='quota' ? Math.round((p.angariado||0)/p.orc*100) : null;
  return `
  <div class="card">
    <div class="card-head" style="flex-wrap:wrap;row-gap:8px">
      <span class="card-ico">${ico('obra')}</span>
      <div><h2>${p.nome}</h2><div class="cell-sub">${p.cat} · conclusão prevista: ${p.data}</div></div>
      <span class="spacer"></span>${pillProj(p.estado)}
    </div>
    <p style="font-size:14px;color:var(--ink-2);margin-bottom:14px">${p.desc}</p>
    <div class="grid g-12" style="gap:12px;margin-bottom:4px">
      <div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px"><span>Execução da obra</span><span class="num">${p.progresso}%</span></div>
        <span class="prog"><i style="width:${p.progresso}%"></i></span>
        <div class="cell-sub" style="margin-top:7px">Orçamento <b class="num">${MT(p.orc)}</b>${p.gasto?` · gasto <b class="num">${MT(p.gasto)}</b>`:''}</div>
      </div>
      <div>
        ${pctFin!==null?`
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px"><span>Angariado</span><span class="num">${pctFin}%</span></div>
        <span class="prog ${pctFin<60?'warn':''}"><i style="width:${Math.min(pctFin,100)}%"></i></span>
        <div class="cell-sub" style="margin-top:7px"><b class="num">${MT(p.angariado||0)}</b> de ${MT(p.orc)} · ${finTxt}</div>`
        :`<div style="font-size:13px;font-weight:700;margin-bottom:5px">Financiamento</div>
        <div class="cell-sub">${finTxt}${p.estado==='pendente'?' · sem cobrança extra aos proprietários':''}</div>`}
      </div>
    </div>
    ${p.updates.length?`<ul class="row-list" style="margin-top:6px">${p.updates.slice(0,2).map(u=>`
      <li><span class="row-ico g">${ico('clock')}</span>
        <div class="row-body"><div class="t" style="font-weight:600;font-size:13.5px">${u.t}</div></div>
        <div class="row-end cell-sub">${u.data}</div></li>`).join('')}</ul>`:''}
    ${papel==='gestor' && p.estado==='aprovado'?`<div style="display:flex;gap:10px;margin-top:12px">
      <button class="btn btn-ghost sm" data-proj-upd="${p.id}">${ico('send','icon sm')}Actualizar progresso</button>
      <button class="btn btn-primary sm" data-proj-concluir="${p.id}">${ico('check','icon sm')}Marcar concluído</button>
    </div>`:''}
    ${papel==='gestor' && p.estado==='pendente'?`<div class="note" style="margin-top:12px">${ico('shield','icon sm')}<span>Enviado à consola. ${p.fin==='quota'?'A quota extraordinária só é cobrada depois da aprovação.':p.fin==='associacao'?'Depois de validado, segue para votação na assembleia da associação de condomínios.':'Será pago pelo fundo do condomínio depois da aprovação.'}</span></div>`:''}
  </div>`;
}

function bindLogin(el){
  const be = el.querySelector('#btn-entrar');
  if(be) be.addEventListener('click',()=>{
    const em = $('#lg-email').value.trim();
    if(!em){ toast('Escreva o seu email'); $('#lg-email').focus(); return; }
    if(!$('#lg-pw').value){ toast('Escreva a sua password'); $('#lg-pw').focus(); return; }
    login('gestor');
  });
  const lr = el.querySelector('#lnk-rec');
  if(lr) lr.addEventListener('click',()=>toast('Enviámos um link de recuperação para o seu email'));
  const lc = el.querySelector('#lnk-conv');
  if(lc) lc.addEventListener('click',()=>{ S.loginView='convite'; render(); });
  const lv = el.querySelector('#lnk-voltar');
  if(lv) lv.addEventListener('click',()=>{ S.loginView='entrar'; render(); });
  const bc = el.querySelector('#btn-conv');
  if(bc) bc.addEventListener('click',()=>{
    if(!$('#cv-cod').value.trim()){ toast('Escreva o código de convite da sua flat'); $('#cv-cod').focus(); return; }
    const p1=$('#cv-pw').value, p2=$('#cv-pw2').value;
    if(p1.length<8){ toast('A password precisa de pelo menos 8 caracteres'); $('#cv-pw').focus(); return; }
    if(p1!==p2){ toast('As passwords não coincidem'); $('#cv-pw2').focus(); return; }
    if(!$('#cv-termos').checked){ toast('Aceite os Termos e Condições para criar a conta'); return; }
    toast('Conta criada e ligada à Flat 302 · bem-vinda, Celeste');
    login('proprietario');
  });
  el.querySelectorAll('[data-login]').forEach(b=>b.addEventListener('click',()=>login(b.dataset.login)));
  el.querySelectorAll('[data-termos]').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault(); e.stopPropagation();
    abrirModal(modalTermos()); bindGlobais($('#modal'));
  }));
}

  proprietario:{inicio:scrPropInicio, minhaflat:scrPropFlat, faturas:scrPropFaturas, projectosP:scrPropProjectos, suporte:scrPropSuporte, avisosP:scrPropAvisos, perfil:scrPerfil},
  admin:{visao:scrAdminVisao, condos:scrAdminCondos, condoDetail:scrAdminCondoDetail, colabs:scrAdminColabs, repasses:scrAdminRepasses, config:scrAdminConfig, perfil:scrPerfil},
  colaborador:{cadastro:scrColabCadastro, perfil:scrPerfil},
};

function render(){
  document.body.classList.toggle('auth', !S.aut);
  if(!S.aut){
    const el = $('#screen');
    el.innerHTML = scrLogin();
    el.classList.remove('screen'); void el.offsetWidth; el.classList.add('screen');
    bindLogin(el);
    window.scrollTo({top:0});
    return;
  }
  renderNav();
  const scr = SCREENS[S.role][S.screen] || Object.values(SCREENS[S.role])[0];
  const el = $('#screen');
  el.innerHTML = scr();
  el.classList.remove('screen'); void el.offsetWidth; el.classList.add('screen');
  bindMonth();
  bindScreen(el);
  window.scrollTo({top:0});
}

function confirmarTransf(id){
  const t = S.transf.find(x=>x.id===id);
  if(!t) return;
  S.transf = S.transf.filter(x=>x.id!==id);
  S.pagos[t.flat.id] = 'pago';
  toast(`Flat ${t.flat.numero} marcada como paga · recibo enviado`);
  render();
}

function abrirPagamento(m){
  if(m==='banco'){ abrirModal(modalBanco()); }
  else { abrirModal(modalMpesa(m)); }
  bindGlobais($('#modal'));
  const push = $('#btn-push');
  if(push) push.addEventListener('click',()=>{
    abrirModal(modalPush(m));
    setTimeout(()=>{ abrirModal(modalRecibo(totalFatura(ctxPay().valor))); bindGlobais($('#modal')); }, 2200);
  });
  const up = $('#btn-upload');
  if(up) up.addEventListener('click',()=>{ fecharTudo(); toast('Comprovativo enviado · aguarda confirmação do gestor'); });
}

function emailColab(c){
  if(c.email) return c.email;
  const p = slug(c.nome.split(' ')[0]), u = slug(c.nome.split(' ').slice(-1)[0]);
  return c.funcao==='Gestor' ? `${p}.${u}@gmail.com` : `${p}.${u}@maputorenova.co.za`;
}

function modalTermos(){
  return `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
    <h3 style="font-size:17px;font-weight:800">Termos e Condições</h3>
    <button class="icon-btn" data-close-modal aria-label="Fechar" style="margin-left:auto">${ico('x','icon sm')}</button>
  </div>
  <div style="max-height:52vh;overflow-y:auto;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;padding-right:6px">
    <p><b>1. O serviço.</b> O Maputo Renova é uma plataforma de gestão e cobrança de quotas de condomínio: emite faturas, recebe pagamentos por M-Pesa, eMola e transferência bancária, envia avisos por SMS e email, e repassa os valores cobrados ao condomínio.</p>
    <p><b>2. Taxa de serviço.</b> Sobre cada quota é cobrada uma taxa de serviço (15%, salvo acordo diferente), a única taxa paga pelo proprietário. Dela são deduzidos os custos de operadores e comunicações.</p>
    <p><b>3. Repasses.</b> O condomínio recebe as quotas por inteiro, por transferência bancária, com comprovativo e registo no razão.</p>
    <p><b>4. Dados pessoais.</b> Os dados de proprietários e gestores são usados exclusivamente para a gestão do condomínio e comunicações do serviço, nos termos da lei moçambicana.</p>
    <p><b>5. Conta e acesso.</b> A conta do proprietário está ligada à flat e ao seu titular; emails de acesso só podem ser alterados pelo gestor (moradores) ou pela consola (gestores e colaboradores), com auditoria.</p>
    <p><b>6. Rescisão.</b> Qualquer das partes pode terminar o serviço com aviso prévio de 30 dias; os saldos por repassar são liquidados no fecho.</p>
    <p class="cell-sub">Texto de demonstração — a versão legal final será fornecida pela empresa operadora.</p>
  </div>
  <button class="btn btn-primary" data-close-modal style="margin-top:16px;width:100%;justify-content:center">Fechar</button>`;
}

function bindGlobais(root){
  root.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',fecharTudo));
  root.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click',fecharModal));
  root.querySelectorAll('[data-termos]').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault(); e.stopPropagation();
    abrirModal(modalTermos()); bindGlobais($('#modal'));
  }));
  root.querySelectorAll('[data-doc-upload]').forEach(b=>b.addEventListener('click',()=>{
    const el = root.querySelector('#'+b.dataset.docUpload+'-doc-estado');
    if(el){ el.innerHTML = '<b style="color:var(--green-700)">documento_frente_verso.pdf anexado</b>'; }
    toast('Documento anexado (demonstração)');
  }));
  root.querySelectorAll('[data-doc-foto]').forEach(b=>b.addEventListener('click',()=>{
    const el = root.querySelector('#'+b.dataset.docFoto+'-doc-estado');
    if(el){ el.innerHTML = '<b style="color:var(--green-700)">foto do documento capturada</b>'; }
    toast('Foto capturada (demonstração)');
  }));
  const fds = root.querySelector('#fd-save');
  if(fds) fds.addEventListener('click',()=>{
    const em = root.querySelector('#fd-email').value.trim();
    if(!em){ toast('O email não pode ficar vazio'); return; }
    toast('Email do proprietário actualizado · registado na auditoria');
  });
  const fdr = root.querySelector('#fd-resend');
  if(fdr) fdr.addEventListener('click',()=>toast(`Acesso reenviado para ${root.querySelector('#fd-email').value.trim()}`));
  root.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
    try{navigator.clipboard.writeText(b.dataset.copy);}catch(e){}
    toast('Referência copiada');
  }));
  root.querySelectorAll('[data-save-despesa]').forEach(b=>b.addEventListener('click',()=>{
    if(!root.querySelector('#dsp-d').value.trim()){ toast('Descreva a despesa'); return; }
    if(!root.querySelector('#dsp-v').value.trim()){ toast('Indique o valor da despesa'); return; }
    const st = root.querySelector('#dsp-doc-estado');
    if(st && !/anexad|capturad/.test(st.textContent)){ toast('Anexe a fatura de pagamento — é obrigatória'); return; }
    fecharTudo(); toast('Despesa registada na tesouraria · fatura no extrato');
  }));
  root.querySelectorAll('[data-save-repasse]').forEach(b=>b.addEventListener('click',()=>{ fecharTudo(); toast('Repasse registado · o gestor foi notificado'); }));
}
